name: test

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "kit-toolchain-e2b/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
  workflow_dispatch:
  # W0(schedule): this suite previously ran ONLY on its own repo's PRs/pushes
  # — a regression landing on donmai@main went undetected here until someone
  # next touched donmai-smokes itself (the exact gap that let a broken pi
  # harness ship through multiple donmai releases before donmai#215 caught
  # it manually). The nightly `ref: main` checkout above already floats to
  # whatever donmai@main is at run time, so a schedule trigger alone turns
  # this into a daily regression watch with zero further wiring.
  # 07:18 UTC sits between rensei-smokes' smoke-nightly.yml (06:00 UTC) and
  # its daily-node-smokes.yml (08:00 UTC) — offset so all three don't queue
  # runners at the same top of the hour.
  schedule:
    - cron: "18 7 * * *"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "go test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Was 15 while the live-daemon steps SKIPPED on hosted runners (missing
    # sibling). They now actually execute — cold donmai build (~60-90s) + a
    # foreground daemon per live step under -race — so the budget is raised.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Two-repo checkout so the live-daemon smokes actually run instead of
      # t.Skipf-ing on an absent ../donmai. This harness EXISTS to drive the
      # donmai daemon lifecycle; skipping it in hosted CI meant a daemon
      # regression could never red this repo (donmai-scan friction #2). Mirrors
      # the two-repo pattern donmai-architecture/boundary-sync.yml already uses.
      # Both repos are public, so the default GITHUB_TOKEN reads RenseiAI/donmai.
      - name: Check out donmai-smokes
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: donmai-smokes

      - name: Check out sibling donmai (system under test)
        uses: actions/checkout@v7
        with:
          repository: RenseiAI/donmai
          ref: main
          fetch-depth: 1
          path: donmai

      # `ref: main` is a ROLLING target: this suite is pinned to whatever
      # donmai/main happens to be at job-start, not to the SHA the smokes
      # author was developing against. A smoke that asserts behaviour still
      # in flight upstream therefore fails, and a re-run minutes later passes
      # once the donmai PR merges — indistinguishable from a flake unless the
      # SHA under test is recorded. (Observed twice: runs 30157154869 and
      # 30114625388, both "fail then re-run green" on an unchanged smokes SHA.)
      # Record the provenance up front so any failure is self-diagnosing.
      - name: Record donmai SHA under test
        working-directory: donmai
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --pretty=%s)"
          committed="$(git log -1 --pretty=%cI)"
          echo "DONMAI_SHA_UNDER_TEST=${sha}" >> "$GITHUB_ENV"
          {
            echo "### donmai under test (\`ref: main\`, rolling)"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| SHA | \`${sha}\` |"
            echo "| subject | ${subject} |"
            echo "| committed | ${committed} |"
            echo
            echo "If a smoke asserting new donmai behaviour failed here, check that its"
            echo "upstream change is actually contained in this SHA before calling it a flake."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "donmai under test: ${sha} — ${subject} (${committed})"

      - uses: actions/setup-go@v7
        with:
          # The smokes module (go 1.25.12, requires donmai v0.54.0) AND the
          # sibling donmai build both need a modern toolchain; sourcing it from
          # go.mod avoids a per-run GOTOOLCHAIN auto-download of the pinned
          # version and keeps CI's Go in lockstep with the module.
          go-version-file: donmai-smokes/go.mod
          cache: true
          cache-dependency-path: donmai-smokes/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Node/npm for the opencode harness lane (step18) AND the pi harness
      # lane (step20): npm is how harness/opencode_install.go and
      # harness/pi_install.go install their respective pinned CLIs when not
      # already on PATH, and step20's real-binary tests additionally need
      # `node` itself directly on PATH — `pi` is a `#!/usr/bin/env node`
      # script, so without node here those tests DeclineLive (a recorded,
      # but still silent-in-the-tally, skip) instead of exercising the real
      # binary. Mirrors the setup-go/setup-python steps above (pin the
      # toolchain via its dedicated setup action rather than trusting
      # whatever the runner image ships).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Install the pinned opencode CLI (harness.OpenCodePinnedVersion,
      # kept in lockstep with donmai's provider/harness/opencode.PinnedVersion
      # by the pin-bump protocol, 07-design-opencode-spawn.md §8) into an
      # isolated prefix and put it on PATH — same shape as the donmai
      # pre-build step below: prove the CI-side dependency resolves BEFORE
      # the suite runs, rather than letting step18 discover a broken
      # install lazily. harness.EnsureOpenCodeBinary's PATH fast-path then
      # reuses this binary instead of installing it again per-test.
      - name: Install pinned opencode CLI
        run: |
          npm install -g --no-audit --no-fund --prefix "${RUNNER_TEMP}/opencode-pin" opencode-ai@1.17.18
          echo "${RUNNER_TEMP}/opencode-pin/bin" >> "$GITHUB_PATH"

      - name: Verify pinned opencode CLI
        run: |
          "${RUNNER_TEMP}/opencode-pin/bin/opencode" --version

      # Warm the donmai module cache and prove the binary-under-test builds
      # BEFORE the suite, with a 2-attempt retry (Wave 0 mitigation: a flaky
      # sibling checkout/build must not brick the merge queue, and a build
      # break should fail here fast rather than surface as an opaque in-test
      # skip). GOWORK is cleared so ../donmai resolves its own go.mod — matches
      # what harness.BuildBinary does for the in-test build.
      - name: Pre-build donmai binary (warm cache, 2-attempt retry)
        working-directory: donmai
        run: |
          set -u
          for attempt in 1 2; do
            if GOWORK= go build -o "${RUNNER_TEMP}/donmai-prebuild" ./cmd/donmai; then
              echo "donmai build OK (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::donmai sibling build attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "::error::donmai sibling build failed after 2 attempts"
          exit 1

      - name: kit toolchain local gates
        working-directory: donmai-smokes
        run: make test-kit-toolchain

      - name: go vet
        working-directory: donmai-smokes
        run: go vet ./...

      # GOWORK=off + -race matches the Makefile gate (`make test`). The
      # sibling ../donmai is now present, so the live-daemon steps
      # (step1..step6 in the root package) execute instead of skipping.
      # Tee the verbose output so the liveness guard below can assert the
      # daemon-lifecycle canary actually ran.
      - name: go test
        working-directory: donmai-smokes
        run: |
          set -o pipefail
          GOWORK=off go test -race -v ./... -timeout 18m 2>&1 | tee "${RUNNER_TEMP}/gotest.log"

      # Skip-count visibility. `go test` exits 0 whether a
      # test PASSED or SKIPPED, so coverage can silently drain away one skip
      # knob at a time — this repo has five of them (DONMAI_SMOKES_SKIP_*) and
      # every live smoke is contractually required to skip cleanly. Publish the
      # PASS/FAIL/SKIP tally plus every skipped test name to the job summary so
      # an accumulating skip set is visible on the run page instead of buried
      # in 3 MB of -v output. Reporting only: this step never fails the job.
      # Runs on failure too — a failed run's skip set is the interesting one.
      - name: Test outcome tally (pass / fail / skip)
        if: always()
        working-directory: donmai-smokes
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/gotest.log"
          if [ ! -f "$LOG" ]; then
            echo "no gotest.log (suite did not run) — nothing to tally"
            exit 0
          fi
          pass=$(grep -cE '^\s*--- PASS: ' "$LOG" || true)
          fail=$(grep -cE '^\s*--- FAIL: ' "$LOG" || true)
          skip=$(grep -cE '^\s*--- SKIP: ' "$LOG" || true)
          {
            echo "### Test outcomes (${{ matrix.os }}) — includes subtests"
            echo
            echo "| PASS | FAIL | SKIP |"
            echo "| ---: | ---: | ---: |"
            echo "| ${pass} | ${fail} | ${skip} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$skip" -gt 0 ]; then
            {
              echo
              echo "<details><summary>${skip} skipped test(s)</summary>"
              echo
              echo '```'
              grep -E '^\s*--- SKIP: ' "$LOG" | sed -E 's/^[[:space:]]*--- SKIP: //' | sort
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "outcomes: PASS=${pass} FAIL=${fail} SKIP=${skip}"
          grep -E '^\s*--- SKIP: ' "$LOG" || true

      # Gate-liveness guard (Wave 0.3 / R3.2): the daemon-lifecycle suite's
      # reason for existing is to run the live daemon. If the canary
      # (TestAfDaemonLifecycle, step1) SKIPPED — the exact silent failure this
      # fix removes — or never reported PASS, fail the job even though `go test`
      # exited 0. A deliberately-broken sibling checkout thus reds this repo.
      - name: Guard — daemon-lifecycle smoke must actually execute
        working-directory: donmai-smokes
        run: |
          LOG="${RUNNER_TEMP}/gotest.log"
          if grep -Eq '^\s*--- SKIP: TestAfDaemonLifecycle\b' "$LOG"; then
            echo "::error::TestAfDaemonLifecycle SKIPPED — the live-daemon lifecycle smoke did not run in hosted CI (sibling ../donmai checkout/build did not take effect, donmai@${DONMAI_SHA_UNDER_TEST:-unknown}). This suite's reason for existing did not execute."
            exit 1
          fi
          if ! grep -Eq '^\s*--- PASS: TestAfDaemonLifecycle\b' "$LOG"; then
            echo "::error::TestAfDaemonLifecycle did not report PASS — daemon-lifecycle coverage did not execute (0 live-daemon tests ran, donmai@${DONMAI_SHA_UNDER_TEST:-unknown})."
            exit 1
          fi
          echo "Gate-liveness OK: daemon-lifecycle canary executed (PASS observed, no SKIP)."

      # W0(schedule) pi-lane liveness guard: step20's real-binary tests are
      # the coverage that would have caught the broken pi RPC/extension
      # protocol donmai#215 had to fix by hand — but they sit behind FOUR
      # independent skip paths (-short, DONMAI_SMOKES_SKIP_LIVE_DAEMON, no
      # `node` on PATH, a donmai checkout predating
      # provider/harness/pi/probe.go), any one of which turns a real
      # regression into a quiet "ok" run. Node is already on PATH
      # (setup-node above) and none of the skip knobs are set here, so these
      # three tests currently PASS every run (verified: run 31658167972,
      # 2026-08-13, ubuntu+macos both green in ~15-24s each) — this step
      # exists so that changes ever regressing.
      - name: Guard — pi harness real-binary lane must actually execute
        working-directory: donmai-smokes
        run: |
          LOG="${RUNNER_TEMP}/gotest.log"
          fail=0
          for name in TestPiHarnessSmoke_RealBinary_HandshakeCompletes \
                      TestPiHarnessSmoke_RealBinary_Teardown \
                      TestPiHarnessSmoke_RealBinary_CompletedTurn; do
            if grep -Eq "^\s*--- SKIP: ${name}\b" "$LOG"; then
              echo "::error::${name} SKIPPED — the pi harness real-binary lane did not run in hosted CI (node/pi resolution or donmai@${DONMAI_SHA_UNDER_TEST:-unknown} checkout did not take effect). This is the exact silent-skip shape that let a broken pi protocol ship undetected."
              fail=1
            elif ! grep -Eq "^\s*--- PASS: ${name}\b" "$LOG"; then
              echo "::error::${name} did not report PASS — pi harness real-binary coverage did not execute (donmai@${DONMAI_SHA_UNDER_TEST:-unknown})."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Gate-liveness OK: pi harness real-binary lane executed (PASS observed for all 3 canaries, no SKIP)."

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          # Was a hardcoded "1.23", which made every lint run download Go
          # 1.23.12 (~7s) and then immediately download go1.25.12 again as a
          # GOTOOLCHAIN, because this module declares `go 1.25.12` — two
          # toolchain fetches to lint with one. Sourcing from go.mod (same fix
          # the test job above already documents) fetches once and keeps lint's
          # Go in lockstep with the module instead of drifting on every bump.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # Mirrors ../donmai's CI lint step (same pinned action + version),
      # matching the Makefile gate (`make lint`).
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
